name: Frontend Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crypto unit tests (E2E seal/unseal invariants)
        run: npm run test:crypto
      - run: npm run build
      - name: npm audit (critical)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3: running npm audit..."
            if npm audit --omit=dev --audit-level=critical; then
              exit 0
            fi
            echo "npm audit failed. Retrying in 15s..."
            sleep 15
          done
          exit 1
